<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de edición — Abajo e' la Línea</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bitter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<header>
  <div class="header-inner">
    <div class="wordmark">
      <img src="logo.png" alt="Abajo e' la Línea TV" class="logo-img">
      <div class="wordmark-text">
        <span>Abajo e' la Línea</span>
        <span>Panel de edición</span>
      </div>
    </div>
    <nav>
      <a href="index.html">Volver al sitio</a>
    </nav>
    <button id="logoutBtn" class="live-pill" style="display:none; background:transparent; border:1px solid var(--cream-dim); cursor:pointer;">Cerrar sesión</button>
  </div>
</header>

<section id="admin">
  <div class="wrap" style="max-width:900px;">

    <!-- Login -->
    <form id="loginForm">
      <div class="section-head">
        <div class="section-num">Acceso</div>
        <h2 class="section-title" style="font-size:1.8rem;">Iniciar sesión</h2>
      </div>
      <div class="admin-field">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="admin-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p id="loginError" style="color:var(--red); font-size:0.85rem; display:none;"></p>
      <button type="submit" class="btn btn-solid">Entrar</button>
    </form>

    <!-- Panel -->
    <div id="panel" style="display:none;">
      <div class="section-head">
        <div class="section-num" id="formModeLabel">Nueva</div>
        <h2 class="section-title" style="font-size:1.8rem;">Publicación</h2>
      </div>

      <form id="articleForm">
        <input type="hidden" id="articleId">

        <div class="admin-field">
          <label for="title">Título</label>
          <input type="text" id="title" required>
        </div>

        <div class="admin-field">
          <label for="slug">Slug <button type="button" id="genSlug" class="btn btn-ghost" style="padding:4px 10px; font-size:0.65rem;">Generar desde título</button></label>
          <input type="text" id="slug" required>
        </div>

        <div class="admin-field">
          <label for="category">Categoría</label>
          <select id="category">
            <option value="Deportes">Deportes</option>
            <option value="Cultura">Cultura</option>
            <option value="Comunidad">Comunidad</option>
          </select>
        </div>

        <div class="admin-field">
          <label for="summary">Bajada (resumen corto)</label>
          <textarea id="summary" rows="2" required></textarea>
        </div>

        <div class="admin-field">
          <label for="content">Contenido (un párrafo por línea)</label>
          <textarea id="content" rows="8" required></textarea>
        </div>

        <div class="admin-field">
          <label for="imageFile">Imagen (sube un archivo o pega una URL abajo)</label>
          <input type="file" id="imageFile" accept="image/*">
        </div>
        <div class="admin-field">
          <label for="imageUrl">URL de imagen</label>
          <input type="text" id="imageUrl" placeholder="https://...">
        </div>

        <div class="admin-field">
          <label for="sourceUrl">Fuente original (link de Instagram, opcional)</label>
          <input type="text" id="sourceUrl" placeholder="https://www.instagram.com/p/...">
        </div>

        <div class="admin-field">
          <label for="author">Autor</label>
          <input type="text" id="author" value="Abajo e' la Línea">
        </div>

        <div class="admin-field">
          <label for="status">Estado</label>
          <select id="status">
            <option value="published">Publicado</option>
            <option value="draft">Borrador</option>
          </select>
        </div>

        <div class="admin-field">
          <label for="publishedAt">Fecha de publicación</label>
          <input type="datetime-local" id="publishedAt" required>
        </div>

        <p id="formError" style="color:var(--red); font-size:0.85rem; display:none;"></p>
        <p id="formSuccess" style="color:var(--green); font-size:0.85rem; display:none;"></p>

        <div style="display:flex; gap:12px; margin-top:8px;">
          <button type="submit" class="btn btn-solid" id="saveBtn">Guardar</button>
          <button type="button" class="btn btn-ghost" id="newBtn">Nueva publicación</button>
        </div>
      </form>

      <div class="section-head" style="margin-top:64px;">
        <div class="section-num">Todas</div>
        <h2 class="section-title" style="font-size:1.8rem;">Publicaciones</h2>
      </div>
      <div id="articleList"></div>
    </div>

  </div>
</section>

<script type="module" src="admin.js"></script>

</body>
</html>
